services:
  # =====================================
  # FASTAPI BACKEND
  # =====================================
  api:
    build: .
    container_name: sales_copilot_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  # =====================================
  # STREAMLIT DASHBOARD
  # =====================================
  dashboard:
    build: .
    container_name: sales_copilot_dashboard
    command:
      - streamlit
      - run
      - src/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  # =====================================
  # OLLAMA LLM
  # =====================================
  ollama:
    image: ollama/ollama:latest
    container_name: sales_copilot_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

# =====================================
# PERSISTENT VOLUMES
# =====================================
volumes:
  ollama_data: